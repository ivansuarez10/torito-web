<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Esta página no existe · Carnicería El Torito</title>
<meta name="robots" content="noindex">

<!-- La 404 la sirve GitHub Pages para CUALQUIER ruta que no exista, así que para
     mucha gente es la PRIMERA pantalla del sitio. Por eso lleva la marca entera y
     una salida clara, no un mensaje de sistema.

     Se mantiene en UN archivo, sin JS y sin imágenes nuevas: el único asset es el
     toro que la tienda ya carga (2 KB, normalmente cacheado). PRODUCT.md pone el
     peso de la página como restricción dura, y una pantalla de error es el peor
     lugar para gastarlo. -->

<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- La MISMA URL que index.html: si ya visitó la tienda, sale de caché sin red. -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#000000; --cream:#f2f2f2; --muted:#8f8f8f; --line:#242424;
    --red:#E4232A; --red-d:#c11c22;
    --site:1160px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--cream);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100svh; display:flex; flex-direction:column;
  }

  /* ── cabecera, igual a la de la tienda ── */
  .topbar{
    height:52px; flex:0 0 auto; display:flex; align-items:center;
    border-bottom:1px solid var(--line);
  }
  .topbar .in{
    width:100%; max-width:var(--site); margin:0 auto; padding:0 16px;
  }
  .brand{
    display:inline-flex; align-items:center; gap:10px;
    color:var(--cream); text-decoration:none; transition:opacity .18s;
  }
  .brand:hover{opacity:.82}
  .brand img{height:34px; width:auto; display:block}
  .brand span{font-size:15px; letter-spacing:.14em; font-weight:700}

  /* ── el cuerpo ── */
  main{
    flex:1 1 auto; display:flex; align-items:center;
    width:100%; max-width:var(--site); margin:0 auto; padding:48px 16px 72px;
  }
  .block{max-width:34rem}

  /* El corte. Es el único gesto de la página: una línea roja que se traza como
     el tajo del carnicero, y el texto sube con ella. Un solo momento, no seis. */
  .cut{
    height:2px; background:var(--red); border-radius:2px;
    width:76px; transform-origin:left center;
    animation:cortar 620ms cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes cortar{ from{transform:scaleX(0)} to{transform:scaleX(1)} }

  h1{
    font-family:"Poppins","Helvetica Neue",Helvetica,Arial,sans-serif;
    font-weight:800; font-size:clamp(2.1rem, 7vw, 3.6rem);
    letter-spacing:-.03em; line-height:1.04;
    margin:26px 0 0; text-wrap:balance;
  }
  p{
    color:var(--muted); font-size:16px; line-height:1.62;
    margin:16px 0 0; max-width:30rem;
  }

  .acciones{display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px; margin-top:34px}

  .btn{
    display:inline-flex; align-items:center; gap:9px;
    background:var(--red); color:#fff; text-decoration:none;
    font-family:"Poppins","Helvetica Neue",Helvetica,Arial,sans-serif;
    font-weight:800; font-size:15px; padding:15px 22px; border-radius:12px;
    transition:background .18s, transform .12s; touch-action:manipulation;
  }
  .btn:hover{background:var(--red-d)}
  .btn:active{transform:scale(.97)}
  .btn svg{width:15px; height:15px; stroke:#fff; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}

  .link{
    display:inline-flex; align-items:center; min-height:44px;   /* piso tactil */
    color:var(--cream); font-size:15px; text-decoration:none;
    border-bottom:1px solid #4a4a4a;
    transition:border-color .18s;
  }
  .link:hover{border-bottom-color:var(--red)}

  :where(a,button):focus-visible{
    outline:2px solid var(--red); outline-offset:3px; border-radius:4px;
  }

  /* El texto entra con el mismo gesto del corte, un pelo después. */
  .sube{animation:subir 620ms cubic-bezier(.16,1,.3,1) both; animation-delay:90ms}
  @keyframes subir{ from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none} }

  @media (max-width:560px){
    main{align-items:flex-start; padding-top:16vh}
  }

  @media (prefers-reduced-motion: reduce){
    .cut,.sube{animation:none}
  }
</style>
</head>

<body>

<header class="topbar">
  <div class="in">
    <a class="brand" href="/" aria-label="El Torito · ir al inicio">
      <img src="img/torito-bull.webp" alt="">
      <span>EL TORITO</span>
    </a>
  </div>
</header>

<main>
  <div class="block">
    <div class="cut"></div>

    <h1 class="sube">Esta página no existe.</h1>

    <p class="sube">
      El enlace que abriste no lleva a ningún lado: puede estar viejo o escrito
      distinto. Lo que sí tenemos está en la tienda, con los precios del día.
    </p>

    <div class="acciones sube">
      <a class="btn" href="/">
        Ver la tienda
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
      <a class="link" href="https://wa.me/50493785051" rel="noopener">
        ¿Buscabas algo puntual? Escribinos.
      </a>
    </div>
  </div>
</main>

</body>
</html>
