# GitHub Pages publica este repo con Jekyll. Este archivo existe SOLO para que la
# documentación interna no quede servida en el dominio de la tienda: los archivos
# de abajo siguen en el repo y viajan con el código, pero dejan de responder en
# carniceriaeltorito.com/<archivo>.
#
# ⚠️ NO agregar acá nada que el sitio necesite en vivo. Tienen que seguir
# publicándose: index.html, catalog.json, img/, panel/ y CNAME. Excluir
# catalog.json por error deja la tienda sin catálogo.
exclude:
  - CLAUDE.md
  - PRODUCT.md
  # Checklist interno de SEO (datos para pegar en Google Business y Search
  # Console). Es documentación para Ivan, no una página de la tienda.
  - SEO_PENDIENTES_IVAN.md
  # Los .sql son de administración de la base: describen tablas, políticas de
  # seguridad y notas internas. No los necesita nadie que entre a comprar.
  - "*.sql"
  - SQL_cart_events.sql
